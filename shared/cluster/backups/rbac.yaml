apiVersion: v1
kind: ServiceAccount
metadata:
  name: backups
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backups
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
# One rule for the whole home lab: the backup Job manages Deployments in every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backups
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backups
subjects:
  - kind: ServiceAccount
    name: backups
    namespace: backups
