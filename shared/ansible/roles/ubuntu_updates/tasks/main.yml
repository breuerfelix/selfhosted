---
- name: Require Ubuntu 24.04
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'

- name: Read current host timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: current_timezone
  changed_when: false
  check_mode: false

- name: Ensure unattended-upgrades is installed
  ansible.builtin.package:
    name: unattended-upgrades
    state: present

- name: Set shared maintenance timezone
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-timezone
      - '{{ maintenance_timezone }}'
  when: current_timezone.stdout != maintenance_timezone
  notify: Restart APT timers

- name: Inspect legacy reboot timer
  ansible.builtin.stat:
    path: /etc/systemd/system/nightly-reboot.timer
  register: legacy_reboot_timer

- name: Disable legacy reboot timer
  ansible.builtin.systemd_service:
    name: nightly-reboot.timer
    enabled: false
    state: stopped
  when: legacy_reboot_timer.stat.exists

- name: Remove superseded local update policy and timer units
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /etc/apt/apt.conf.d/52unattended-upgrades-local
    - /etc/systemd/system/apt-daily.timer.d/schedule.conf
    - /etc/systemd/system/apt-daily-upgrade.timer.d/schedule.conf
    - /etc/systemd/system/nightly-reboot.timer
    - /etc/systemd/system/nightly-reboot.service
  notify: Restart APT timers

- name: Create APT timer override directories
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}.timer.d'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - apt-daily
    - apt-daily-upgrade

- name: Configure shared APT timer schedules
  ansible.builtin.template:
    src: apt-timer.conf.j2
    dest: '/etc/systemd/system/{{ item.name }}.timer.d/override.conf'
    owner: root
    group: root
    mode: '0644'
  loop:
    - { name: apt-daily, time: '{{ ubuntu_updates_refresh_time }}' }
    - { name: apt-daily-upgrade, time: '{{ ubuntu_updates_install_time }}' }
  notify: Restart APT timers

- name: Configure shared package origins and conditional reboot
  ansible.builtin.template:
    src: unattended-upgrades.conf.j2
    dest: /etc/apt/apt.conf.d/90selfhosted-unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/apt-config -c %s dump

- name: Ensure APT timers are enabled and active
  ansible.builtin.systemd_service:
    name: '{{ item }}.timer'
    enabled: true
    state: started
  loop:
    - apt-daily
    - apt-daily-upgrade
