name: Build backup image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-backups.yml
      - shared/images/backups/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: backups-image

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        env:
          IMAGE: ghcr.io/breuerfelix/selfhosted/restic-kubectl
        run: |
          docker build --tag "$IMAGE:latest" --tag "$IMAGE:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            shared/images/backups
          docker push --all-tags "$IMAGE"
