name: Build backup image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-backups.yml
      - shared/images/backups/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backups-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/breuerfelix/selfhosted/restic-kubectl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Match the deployment image to the Dockerfile
        run: |
          IMAGE="$IMAGE_NAME:build-$(sha256sum shared/images/backups/Dockerfile | cut -d ' ' -f 1)"
          grep -Fx "              image: $IMAGE" shared/cluster/backups/cronjob.yaml
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the backup tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: shared/images/backups
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Check the tools with the backup security settings
        run: |
          docker run --rm --read-only --cap-drop ALL --cap-add DAC_READ_SEARCH \
            --security-opt no-new-privileges --tmpfs /tmp \
            --env HOME=/tmp --entrypoint /bin/sh "$IMAGE" -ec '
              restic version
              kubectl version --client=true
            '
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        run: |
          docker push "$IMAGE"
          reference=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          printf '## Backup image\n\nTag: `%s`\n\nDigest: `%s`\n\nMake the GHCR package public so both clusters can pull it.\n' \
            "$IMAGE" "$reference" >> "$GITHUB_STEP_SUMMARY"
