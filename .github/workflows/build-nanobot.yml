name: Build nanobot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-nanobot.yml
      - beelink/images/nanobot/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: nanobot-image

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read upstream source
        id: source
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' beelink/images/nanobot/source.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: upstream
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          CHANNELS: ${{ steps.source.outputs.channels }}
          EXTRAS: ${{ steps.source.outputs.extras }}
        run: |
          docker build --tag nanobot-upstream:local \
            --build-arg NANOBOT_CHANNELS="$CHANNELS" \
            --build-arg NANOBOT_EXTRAS="$EXTRAS" upstream
          docker build --tag "$IMAGE:latest" --tag "$IMAGE:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            beelink/images/nanobot
          docker push --all-tags "$IMAGE"
