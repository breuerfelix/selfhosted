name: Build nanobot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-nanobot.yml
      - beelink/images/nanobot/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: nanobot-image

env:
  NANOBOT_REF: v0.4.1 # renovate: datasource=github-releases depName=HKUDS/nanobot
  IMAGE: ghcr.io/breuerfelix/nanobot

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        run: |
          docker build --tag nanobot-upstream:local \
            --build-arg NANOBOT_CHANNELS= \
            --build-arg NANOBOT_EXTRAS= \
            "https://github.com/HKUDS/nanobot.git#$NANOBOT_REF"
          docker build --tag "$IMAGE:latest" --tag "$IMAGE:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            beelink/images/nanobot
          docker push --all-tags "$IMAGE"
