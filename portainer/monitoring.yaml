services:
  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    restart: unless-stopped
    user: "0"
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}"
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - /data/grafana:/var/lib/grafana
    networks:
      - monitoring

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.150.0
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - -storageDataPath=/data
      - -retentionPeriod=10y
      - -httpListenAddr=:8428
    volumes:
      - /data/victoriametrics:/data
    ports:
      - "8428:8428"
    networks:
      - monitoring

  cadvisor:
    # cAdvisor v0.56.0+ avoids the unconditional containerd probe on overlay2.
    # The Beelink dashboard depends on Docker container name labels.
    image: ghcr.io/google/cadvisor:0.60.5
    container_name: cadvisor
    restart: unless-stopped
    command:
      - --housekeeping_interval=15s
    volumes:
      # Read-only host views required for machine and container metrics.
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      # cAdvisor needs Docker metadata; it never writes to the socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  vmagent:
    image: victoriametrics/vmagent:v1.150.0
    container_name: vmagent
    restart: unless-stopped
    command:
      - -promscrape.config=/etc/vmagent/prometheus.yml
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
      - -remoteWrite.tmpDataPath=/vmagentdata
    configs:
      - source: vmagent-scrape-config
        target: /etc/vmagent/prometheus.yml
    depends_on:
      - victoriametrics
      - cadvisor
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - /data/loki:/loki
    networks:
      - monitoring

configs:
  vmagent-scrape-config:
    # Portainer Git stacks do not materialize relative Compose config files.
    # Keep this small scrape configuration inline so the stack is deployable
    # directly from the repository's configured Compose path.
    content: |
      global:
        scrape_interval: 15s
        scrape_timeout: 10s

      scrape_configs:
        - job_name: beelink-cadvisor
          static_configs:
            - targets:
                - cadvisor:8080
              labels:
                host: beelink
                service: cadvisor

        - job_name: victoriametrics
          static_configs:
            - targets:
                - victoriametrics:8428

networks:
  monitoring:
    # Keep existing network name for the monitoring agents.
    name: monitoring_monitoring
