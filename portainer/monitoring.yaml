# Grafana, Loki, and VictoriaMetrics retired to Beelink K3s on 2026-11-01.
# Keep stack 26 GitOps updates DISABLED. Do not redeploy this shared stack.
# Backend definitions are rollback references only: never start them while K3s
# owns /data/grafana, /data/loki, or /data/victoriametrics.
# cAdvisor and vmagent were removed on 2026-11-01; no collector is deployed here.
services:
  # RETIRED: rollback only; stop Kubernetes writers before starting Docker.
  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    user: "0"
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - /data/grafana:/var/lib/grafana
    networks:
      - monitoring

  # RETIRED: rollback only; stop Kubernetes writers before starting Docker.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - -storageDataPath=/data
      - -retentionPeriod=10y
      - -httpListenAddr=:8428
    volumes:
      - /data/victoriametrics:/data
    ports:
      - "8428:8428"
    networks:
      - monitoring

  # RETIRED: rollback only; stop Kubernetes writers before starting Docker.
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - /data/loki:/loki
    networks:
      - monitoring

networks:
  monitoring:
    # Preserve the old network name for an explicitly coordinated backend rollback.
    name: monitoring_monitoring
