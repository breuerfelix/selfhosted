services:
  dawarich_redis:
    image: redis:7.4-alpine
    container_name: dawarich_redis
    command: redis-server
    networks:
      - dawarich
    volumes:
      - /data/dawarich/redis:/var/shared/redis
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  dawarich_db:
    image: postgis/postgis:17-3.5-alpine
    shm_size: 1G
    container_name: dawarich_db
    volumes:
      - /data/dawarich/db:/var/lib/postgresql/data
    networks:
      - dawarich
    environment:
      POSTGRES_USER: ${DAWARICH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DAWARICH_DB_PASSWORD}
      POSTGRES_DB: ${DAWARICH_DB_NAME:-dawarich_production}
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DAWARICH_DB_USERNAME:-postgres}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  dawarich_app:
    image: freikin/dawarich:latest
    container_name: dawarich_app
    volumes:
      - /data/dawarich/public:/var/app/public
      - /data/dawarich/watched:/var/app/tmp/imports/watched
      - /data/dawarich/storage:/var/app/storage
      - /data/dawarich/db:/dawarich_db_data
    networks:
      - dawarich
    ports:
      - 3000:3000
    stdin_open: true
    tty: true
    entrypoint: web-entrypoint.sh
    command: ['bin/rails', 'server', '-p', '3000', '-b', '::']
    restart: on-failure
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://dawarich_redis:6379
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DAWARICH_DB_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD}
      DATABASE_NAME: ${DAWARICH_DB_NAME:-dawarich_production}
      MIN_MINUTES_SPENT_IN_CITY: 60
      APPLICATION_HOSTS: ${DAWARICH_APPLICATION_HOSTS:-localhost,::1,127.0.0.1,192.168.178.13}
      TIME_ZONE: ${DAWARICH_TIME_ZONE:-Europe/Berlin}
      APPLICATION_PROTOCOL: http
      PROMETHEUS_EXPORTER_ENABLED: false
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"
      STORE_GEODATA: "true"
      PHOTON_API_HOST: photon.komoot.io
      PHOTON_API_USE_HTTPS: true
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '"status"'
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
  dawarich_sidekiq:
    image: freikin/dawarich:latest
    container_name: dawarich_sidekiq
    volumes:
      - /data/dawarich/public:/var/app/public
      - /data/dawarich/watched:/var/app/tmp/imports/watched
      - /data/dawarich/storage:/var/app/storage
    networks:
      - dawarich
    stdin_open: true
    tty: true
    entrypoint: sidekiq-entrypoint.sh
    command: ['bundle', 'exec', 'sidekiq']
    restart: on-failure
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://dawarich_redis:6379
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DAWARICH_DB_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD}
      DATABASE_NAME: ${DAWARICH_DB_NAME:-dawarich_production}
      APPLICATION_HOSTS: ${DAWARICH_APPLICATION_HOSTS:-localhost,::1,127.0.0.1,192.168.178.13}
      BACKGROUND_PROCESSING_CONCURRENCY: 10
      APPLICATION_PROTOCOL: http
      PROMETHEUS_EXPORTER_ENABLED: false
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"
      STORE_GEODATA: "true"
      PHOTON_API_HOST: photon.komoot.io
      PHOTON_API_USE_HTTPS: true
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f sidekiq" ]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
      dawarich_app:
        condition: service_healthy
        restart: true

networks:
  dawarich:
