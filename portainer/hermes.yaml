# Hermes gateway plus colocated Hindsight service.
#
# Important: do not deploy this stack while the current standalone `hermes`
# container is still running, or host ports/container names will conflict.
services:
  hermes:
    image: nousresearch/hermes-agent:v2026.8.19
    container_name: hermes
    restart: always
    command:
      - gateway
      - run
    environment:
      HERMES_DASHBOARD: "${HERMES_DASHBOARD:-1}"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?HERMES_DASHBOARD_BASIC_AUTH_USERNAME must be set}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?HERMES_DASHBOARD_BASIC_AUTH_PASSWORD must be set}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?HERMES_DASHBOARD_BASIC_AUTH_SECRET must be set}"
    ports:
      - "8642:8642"
      - "9119:9119"
    volumes:
      - /data/hermes:/opt/data
      # Keep native Hermes backup archives outside the main Hermes state tree.
      # The restic stack includes this host path explicitly.
      - /data/hermes-backup:/opt/data/backups

  # Hermes Workspace is a separate web UI. It connects to the existing Hermes
  # gateway/dashboard and does not start a second Hermes Agent runtime.
  hermes-workspace:
    # Source: https://github.com/outsourc-e/hermes-workspace
    # Immutable digest for the image published from commit c631425.
    image: ghcr.io/outsourc-e/hermes-workspace:latest@sha256:1ec05339750da7caaf1cd0183c8c3b188856918b377407b4ac1dafca67e42d88
    container_name: hermes-workspace
    depends_on:
      - hermes
    restart: unless-stopped
    environment:
      # Share the Hermes home so profiles, config, memory, and skills are
      # visible; canonical sessions are accessed through the APIs above.
      HERMES_HOME: "/home/workspace/.hermes"
      # Keep the file browser scoped to an explicit persistent directory.
      HERMES_WORKSPACE_DIR: "/workspace"
      # Reach the existing services over the hermes Compose network.
      HERMES_API_URL: "http://hermes:8642"
      HERMES_DASHBOARD_URL: "http://hermes:9119"
      # Set API_SERVER_KEY in the Portainer stack environment when the gateway
      # API is authenticated; do not commit its value here.
      HERMES_API_TOKEN: "${API_SERVER_KEY:-}"
      # The Workspace container binds 0.0.0.0 internally and requires its own
      # password even though the host publish below is loopback-only.
      HERMES_PASSWORD: "${HERMES_WORKSPACE_PASSWORD:?HERMES_WORKSPACE_PASSWORD must be set}"
      # Use 1 behind the existing HTTPS tunnel; set 0 for direct plain HTTP.
      COOKIE_SECURE: "${HERMES_WORKSPACE_COOKIE_SECURE:-1}"
    ports:
      # Keep the high-privilege UI off the public interface; route it through
      # the existing host tunnel/reverse proxy.
      - "127.0.0.1:${HERMES_WORKSPACE_PORT:-3000}:3000"
    volumes:
      - /data/hermes:/home/workspace/.hermes
      - ${HERMES_WORKSPACE_DIR:-/data/hermes/workspace}:/workspace

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.9.2
    container_name: hindsight
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_HOST: "0.0.0.0"
      HINDSIGHT_API_PORT: "8888"
      HINDSIGHT_API_LOG_LEVEL: "${HINDSIGHT_API_LOG_LEVEL:-info}"
      HINDSIGHT_API_LLM_PROVIDER: "${HINDSIGHT_API_LLM_PROVIDER:-openai-codex}"
      HINDSIGHT_API_LLM_MODEL: "${HINDSIGHT_API_LLM_MODEL:-gpt-5.6-luna}"
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: "${HINDSIGHT_API_LLM_OUTPUT_LANGUAGE:-English}"
      # Keep a stable worker identity across container recreates; the image warns
      # that hostname-based defaults strand in-flight tasks after redeploys.
      HINDSIGHT_API_WORKER_ID: "${HINDSIGHT_API_WORKER_ID:-hindsight}"
      # Dedicated, writable Codex OAuth home for optional manual setup.
      CODEX_HOME: "${CODEX_HOME:-/var/lib/hindsight/codex}"
    volumes:
      - /data/hindsight:/home/hindsight/.pg0
      - /data/hindsight/codex:/var/lib/hindsight/codex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
