apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: papra
  namespace: flux-system
spec:
  # Keep suspended until Docker is stopped and recovery is verified.
  suspend: true
  interval: 10m
  dependsOn:
    - name: tailscale
  path: ./beelink/cluster/apps/papra
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
