apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: room-planner
  namespace: flux-system
spec:
  # Disabled until the application and private registry access are ready.
  suspend: true
  interval: 10m
  dependsOn:
    - name: tailscale
  path: ./beelink/cluster/apps/room-planner
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
