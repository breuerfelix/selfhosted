apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nanobot
  namespace: flux-system
spec:
  # Enable in Git only after BOTH Docker containers are stopped.
  suspend: true
  interval: 10m
  dependsOn:
    - name: tailscale
  path: ./beelink/cluster/apps/nanobot
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
