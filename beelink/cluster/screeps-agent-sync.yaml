apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: screeps-agent
  namespace: flux-system
spec:
  # Portainer polling is disabled; both retained Docker workers are stopped with restart=no.
  suspend: false
  interval: 10m
  dependsOn:
    - name: monitoring
  path: ./beelink/cluster/apps/screeps-agent
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
