apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: screeps-agent
  namespace: flux-system
spec:
  # Keep suspended until Portainer updates and both Docker workers are stopped.
  suspend: true
  interval: 10m
  dependsOn:
    - name: monitoring
  path: ./beelink/cluster/apps/screeps-agent
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
