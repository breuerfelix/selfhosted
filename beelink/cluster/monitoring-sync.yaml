apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  # Keep suspended until Docker writers are stopped and backups are verified.
  suspend: true
  interval: 10m
  dependsOn:
    - name: tailscale
  path: ./beelink/cluster/apps/monitoring
  prune: true
  wait: true
  timeout: 15m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
