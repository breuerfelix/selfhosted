apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: room-planner
  namespace: room-planner
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [room-planner]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: room-planner
                port:
                  name: http
