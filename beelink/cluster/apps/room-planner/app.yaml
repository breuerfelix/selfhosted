apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-planner
  namespace: room-planner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: room-planner
  template:
    metadata:
      labels:
        app: room-planner
    spec:
      containers:
        - name: room-planner
          image: ghcr.io/breuerfelix/screeps-room-planner:latest@sha256:c009dd2f14e060983348972465fc7f7b5189adfb4f025da0291fafe01dd2c63f
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3001"
            - name: ROOM_PLANNER_PROXY_URL
              value: http://127.0.0.1:3001
            - name: __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
              value: room-planner.vulture-skink.ts.net
            - name: SCREEPS_LOCAL_SERVER_URL
              value: https://screeps.felixbreuer.me
          ports:
            - name: http
              containerPort: 5173
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: room-planner
  namespace: room-planner
spec:
  type: ClusterIP
  selector:
    app: room-planner
  ports:
    - name: http
      port: 80
      targetPort: 5173
