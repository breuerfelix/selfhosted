# Capacity is a binding declaration, not a quota on this shared SSD.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-loki-data
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: monitoring
    name: loki-data
  hostPath:
    path: /data/loki
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: monitoring-loki-data
  resources:
    requests:
      storage: 10Gi
