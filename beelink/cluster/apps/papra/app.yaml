apiVersion: apps/v1
kind: Deployment
metadata:
  name: papra
  namespace: papra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: papra
  template:
    metadata:
      labels:
        app: papra
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: beelink
      terminationGracePeriodSeconds: 180
      # Match data ownership without recursive changes.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: papra
          image: ghcr.io/papra-hq/papra:26.7.1-rootless@sha256:d1f596a35332ad04d8a69d88a5e19bc82acd47f2bc2fe687dd2145b1ef5a8b19
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: papra-env
          env:
            - name: APP_BASE_URL
              value: https://papra.vulture-skink.ts.net
            # Persistent application paths.
            - name: DATABASE_URL
              value: file:/app/app-data/db/db.sqlite
            - name: DOCUMENT_STORAGE_FILESYSTEM_ROOT
              value: /app/app-data/documents
            - name: PAPRA_CONFIG_DIR
              value: /app/app-data
          ports:
            - name: http
              containerPort: 1221
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/app-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: papra-data
---
apiVersion: v1
kind: Service
metadata:
  name: papra
  namespace: papra
spec:
  type: ClusterIP
  selector:
    app: papra
  ports:
    - name: http
      port: 80
      targetPort: 1221
