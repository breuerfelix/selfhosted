# Capacity is a binding declaration, not a quota on this shared SSD.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: papra-data
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: papra
    name: papra-data
  hostPath:
    path: /data/papra
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: papra-data
  namespace: papra
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: papra-data
  resources:
    requests:
      storage: 10Gi
