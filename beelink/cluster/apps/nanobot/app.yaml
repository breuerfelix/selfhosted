apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanobot
  namespace: nanobot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nanobot
  template:
    metadata:
      labels:
        app: nanobot
    spec:
      securityContext:
        # Matches the running process and SSD ownership. Skip root entrypoint chown.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: nanobot
          # Built from NANOBOT_REF in .github/workflows/build-nanobot.yml.
          image: ghcr.io/breuerfelix/nanobot:latest@sha256:f900289d86bbab1c481af4d534aac72fe4d8d1a1b3bf132aeeaf5d5820b9cf4f
          imagePullPolicy: IfNotPresent
          args: [gateway]
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nanobot-github
                  key: GH_TOKEN
            - name: NANOBOT_DOCKER_BOOTSTRAP
              value: "1"
            - name: XDG_DATA_HOME
              value: /home/nanobot/.nanobot/data
            - name: WORKSPACE_MCP_BASE_URI
              value: http://0.0.0.0
            - name: WORKSPACE_MCP_PORT
              value: "8000"
            - name: GOOGLE_OAUTH_REDIRECT_URI
              value: https://nanobot-workspace.vulture-skink.ts.net/oauth2callback
            - name: WORKSPACE_MCP_CREDENTIALS_DIR
              value: /home/nanobot/.nanobot/auth/google-workspace
          ports:
            - name: http
              containerPort: 8765
            - name: health
              containerPort: 18790
            - name: workspace-oauth
              containerPort: 8000
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18790/health', timeout=4)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18790/health', timeout=4)"
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /home/nanobot/.nanobot
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nanobot-data
---
apiVersion: v1
kind: Service
metadata:
  name: nanobot
  namespace: nanobot
spec:
  selector:
    app: nanobot
  ports:
    - name: http
      port: 80
      targetPort: http
