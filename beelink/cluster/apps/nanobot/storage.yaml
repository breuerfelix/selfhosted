apiVersion: v1
kind: PersistentVolume
metadata:
  name: nanobot-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: nanobot
    name: nanobot-data
  local:
    path: /data/nanobot
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - beelink
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanobot-data
  namespace: nanobot
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: nanobot-data
  resources:
    requests:
      storage: 20Gi
