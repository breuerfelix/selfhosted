apiVersion: v1
kind: PersistentVolume
metadata:
  name: nanobot-data
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: nanobot
    name: nanobot-data
  hostPath:
    path: /data/nanobot
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanobot-data
  namespace: nanobot
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: nanobot-data
  resources:
    requests:
      storage: 20Gi
