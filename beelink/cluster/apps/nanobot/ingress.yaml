apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nanobot
  namespace: nanobot
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - nanobot
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nanobot
                port:
                  name: http
