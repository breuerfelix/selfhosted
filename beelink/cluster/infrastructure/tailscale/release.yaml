apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 24h
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  install:
    remediation:
      # Credentials are supplied after bootstrap. Recover without a manual reset.
      retries: -1
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.2
      sourceRef:
        kind: HelmRepository
        name: tailscale
  values:
    # The chart mounts operator-oauth (client_id/client_secret) by default.
    # SOPS/Flux owns that Secret; Helm never receives credentials as values.
    operatorConfig:
      hostname: beelink-k8s-operator
