---
- name: Configure single-node K3s
  hosts: hetzner
  gather_facts: true
  vars:
    # First install only. Flux's system-upgrade Plan owns subsequent updates.
    k3s_bootstrap_version: v1.36.5+k3s1

  tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version == '24.04'

    - name: Check whether K3s is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Configure single-node K3s
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0600'
        content: |
          # Managed by selfhosted/hetzner/ansible/k3s.yml
          tls-san:
            - "{{ ansible_default_ipv4.address }}"
          write-kubeconfig-mode: "0600"
      register: k3s_config

    - name: Download official K3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/src/k3s-install.sh
        owner: root
        group: root
        mode: '0700'
        force: false
      when: not k3s_binary.stat.exists

    - name: Install pinned K3s
      ansible.builtin.command:
        cmd: /bin/sh /usr/local/src/k3s-install.sh
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_bootstrap_version }}"
        INSTALL_K3S_EXEC: server
        INSTALL_K3S_SKIP_START: 'true'
      when: not k3s_binary.stat.exists

    - name: Enable K3s and apply configuration
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: "{{ 'restarted' if k3s_binary.stat.exists and k3s_config.changed else 'started' }}"
      when: not ansible_check_mode or k3s_binary.stat.exists

    - name: Wait for local Kubernetes API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: 180
      when: not ansible_check_mode

    - name: Wait for node readiness
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false
      when: not ansible_check_mode
