---
- name: Prepare local application storage
  hosts: hetzner
  gather_facts: false

  tasks:
    - name: Create application data directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: '0'
        mode: '0755'
      loop:
        - { path: /srv/k3s-data, owner: '0' }
        - { path: /srv/k3s-data/ghost, owner: '1000' }
        - { path: /srv/k3s-data/fathom, owner: '0' }

    - name: Check original Screeps data directory
      ansible.builtin.stat:
        path: /data/coolify/applications/screeps
      register: screeps_data

    - name: Create Screeps data directory on a fresh host
      ansible.builtin.file:
        path: /data/coolify/applications/screeps
        state: directory
        owner: '1000'
        group: '1000'
        mode: '0755'
      when: not screeps_data.stat.exists
