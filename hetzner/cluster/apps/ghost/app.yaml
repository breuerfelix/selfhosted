apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      containers:
        - name: ghost
          image: ghost:6.78.0-alpine@sha256:baa6dbff91a28ba36c526d1f6e761deb2efe3c238c630c3f318b62f258c2d76e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2368
          env:
            - name: NODE_ENV
              value: development
            - name: security__staffDeviceVerification
              value: "false"
            - name: url
              value: https://danielkueffler.de
            - name: database__connection__filename
              value: /var/lib/ghost/content/data/ghost.db
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: content
              mountPath: /var/lib/ghost/content
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: ghost-content
---
apiVersion: v1
kind: Service
metadata:
  name: ghost
  namespace: apps
spec:
  selector:
    app: ghost
  ports:
    - name: http
      port: 80
      targetPort: http
