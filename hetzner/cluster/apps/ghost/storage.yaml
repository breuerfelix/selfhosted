apiVersion: v1
kind: PersistentVolume
metadata:
  name: ghost-content
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: apps
    name: ghost-content
  hostPath:
    path: /data/ghost
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-content
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: ghost-content
  resources:
    requests:
      storage: 10Gi
