apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      # Service links would inject a non-numeric PHOENIX_PORT.
      enableServiceLinks: false
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:version-22.0.1@sha256:cc8c5e545389a6aae9523beaf92eb067fdaeae59d2166093d60856f89bf7ee34
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6006
          env:
            - name: PHOENIX_WORKING_DIR
              value: /data
            - name: PHOENIX_ENABLE_AUTH
              value: "true"
            - name: PHOENIX_USE_SECURE_COOKIES
              value: "true"
            - name: PHOENIX_CSRF_TRUSTED_ORIGINS
              value: https://phoenix.felixbreuer.me
            - name: PHOENIX_ENABLE_MCP_SERVER
              value: "false"
            - name: PHOENIX_ENABLE_OAUTH2_AUTHORIZATION_SERVER
              value: "false"
            - name: PHOENIX_SECRET
              valueFrom:
                secretKeyRef:
                  name: phoenix-auth
                  key: PHOENIX_SECRET
            - name: PHOENIX_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: phoenix-auth
                  key: PHOENIX_ADMIN_SECRET
            - name: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: phoenix-auth
                  key: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: phoenix-data
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: apps
spec:
  selector:
    app: phoenix
  ports:
    - name: http
      port: 80
      targetPort: http
