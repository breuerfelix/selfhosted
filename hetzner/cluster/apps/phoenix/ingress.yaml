apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phoenix
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - phoenix.felixbreuer.me
        - otel.felixbreuer.me
      secretName: phoenix-tls
  rules:
    - host: phoenix.felixbreuer.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phoenix
                port:
                  name: http
    - host: otel.felixbreuer.me
      http:
        paths:
          - path: /v1/traces
            pathType: Exact
            backend:
              service:
                name: phoenix-collector
                port:
                  name: http
