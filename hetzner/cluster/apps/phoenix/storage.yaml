apiVersion: v1
kind: PersistentVolume
metadata:
  name: phoenix-data
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: apps
    name: phoenix-data
  hostPath:
    path: /data/phoenix
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phoenix-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: phoenix-data
  resources:
    requests:
      storage: 10Gi
