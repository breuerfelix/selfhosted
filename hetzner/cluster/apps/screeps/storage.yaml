apiVersion: v1
kind: PersistentVolume
metadata:
  name: screeps-data
spec:
  capacity:
    storage: 3Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: apps
    name: screeps-data
  hostPath:
    path: /data/screeps
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: screeps-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: screeps-data
  resources:
    requests:
      storage: 3Gi
