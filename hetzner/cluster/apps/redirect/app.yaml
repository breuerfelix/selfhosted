apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redirect
  template:
    metadata:
      labels:
        app: redirect
    spec:
      containers:
        - name: redirect
          image: grahamdigital/simple-redirect:latest@sha256:ae7c5ce98f631b2a07dca8636a1fad973d3a42fcd3a9a6219b1c80324ead964b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PROTOCOL
              value: http
            - name: REDIRECT_TO
              value: breuer.dev
          readinessProbe:
            tcpSocket:
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: redirect
  namespace: apps
spec:
  selector:
    app: redirect
  ports:
    - name: http
      port: 80
      targetPort: http
