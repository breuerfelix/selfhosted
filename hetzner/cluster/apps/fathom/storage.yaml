apiVersion: v1
kind: PersistentVolume
metadata:
  name: fathom-data
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: apps
    name: fathom-data
  local:
    path: /srv/k3s-data/fathom
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - coolify
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fathom-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: fathom-data
  resources:
    requests:
      storage: 1Gi
