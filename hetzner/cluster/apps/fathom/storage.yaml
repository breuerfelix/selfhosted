apiVersion: v1
kind: PersistentVolume
metadata:
  name: fathom-data
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: apps
    name: fathom-data
  hostPath:
    path: /data/fathom
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fathom-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: fathom-data
  resources:
    requests:
      storage: 1Gi
